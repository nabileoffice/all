<!DOCTYPE html>
<html>
<head>
<title>PS4 [5.05] 7.00 - 14.02 FW GoldHEN Host by GamerHack</title>
<link rel="stylesheet" href="../style.css">
<style>
:root{color-scheme:light;font-family:"Segoe UI",Tahoma,sans-serif;background:#e9eef0;color:#172a30}
*{box-sizing:border-box}
html{min-height:100%;overflow-x:hidden;overflow-y:auto;background:#e9eef0;color:#172a30;text-align:center}
body{min-height:100vh;margin:0;padding:0 20px;background:linear-gradient(145deg,#f7f8f5 0%,#e5ecec 58%,#dbe6e4 100%);color:#172a30;text-align:center}
.site-header{margin:0 -20px;padding:18px 20px;background:rgba(255,255,255,.88);border-bottom:1px solid #cbd7d5}
.header-content{display:flex;align-items:center;justify-content:center;gap:16px}
.header-logo{height:72px;width:auto}
.header-titles h1{margin:0;color:#172a30;font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;text-shadow:none}
.page-shell{width:min(100%,720px);margin:54px auto 0}
.eyebrow{margin:0 0 10px;color:#47706a;font-size:12px;font-weight:700;text-transform:uppercase}
h3{margin:0 0 24px;color:#40575b;font-size:16px;font-weight:500}
.status-panel{width:min(100%,600px);margin:0 auto;padding:30px 32px;border:1px solid #cbd7d5;border-left:4px solid #3b8276;border-radius:6px;background:rgba(255,255,255,.9);box-shadow:0 14px 34px rgba(29,54,57,.08);text-align:left}
.status-label{margin:0 0 10px;color:#607477;font-size:12px;font-weight:700;text-transform:uppercase}
#msgs{display:block;margin:0 0 12px;color:#1a3438;font-size:22px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
@media(max-width:560px){body{padding:0 14px}.site-header{margin:0 -14px;padding:14px}.header-logo{height:54px}.header-titles h1{font-size:23px}.page-shell{margin-top:36px}.status-panel{padding:24px 20px}#msgs{font-size:19px}}
</style>
</head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 14.02";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.02) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
		else if (fwNum == 14.00 || fwNum == 14.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb2.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
<header class="site-header">
    <div class="header-content"><img src="includes/NABEELLOGO.svg" alt="Nabil's Logo" class="header-logo"><div class="header-titles"><h1>PS4 Jailbreak</h1></div></div>
</header>
<main class="page-shell">
    <p class="eyebrow"></p>
    <h3>Firmware 5.05 to 14.02</h3>
    <section class="status-panel" aria-live="polite">
        <p class="status-label">Host status</p>
        <div id="msgs">Loading GoldHEN v2.4b18.14... Please Wait</div>
    </section>
</main>
</body>
</html>
